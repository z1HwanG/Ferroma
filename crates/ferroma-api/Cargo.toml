[package]
name = "ferroma-api"
description = "Ferroma HTTP surface: REST API, Ferroma Client Protocol (FCP), WebSocket events, Webmail and Admin hosting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
