base64 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
once_cell = { workspace = true }
regex = { workspace = true }
mime = { workspace = true }
url = { workspace = true }
rustls = { workspace = true }
