[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
pretty_assertions = "1"
# Test infrastructure only. `ferroma-storage` never re-exports a *lazy* pool
# constructor (the runtime one is eager, because the server wants to know at boot
# whether the database is reachable), and the unit tests here need repositories over a
# pool that opens no socket. The published library does not depend on `sqlx`.
sqlx = { workspace = true }
