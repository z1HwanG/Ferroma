# =============================================================================
# Ferroma — the deployment. `docker compose up -d` uses this file.
# =============================================================================
#   ./scripts/deploy.sh && docker compose up -d       # deploy.sh writes .env
#
# One container. The host is assumed to already run PostgreSQL; deploy.sh asks
# for its address, creates the role and database, and writes `.env` with the
# database address, the API bind, the hostname/public URL, the JWT secret and
# the TLS settings. This file reads that `.env` — `docker compose up -d` alone
# still refuses to start without it, rather than booting on insecure defaults.
# See docs/deployment.md §3.2.
#
# docker-compose.demo.yml is the other file, and it is a demonstration: it builds
# this checkout, starts its own PostgreSQL, and serves everything in plaintext.
#   * TLS terminated by Ferroma itself on 465 / 993 / 8443
#   * PostgreSQL tuned for a real workload and not merely "the defaults"
#   * host port 25 / 587 / 143 still bound, but the implicit-TLS ports are added
#   * resource limits, restart policies and bounded logs on every service
#   * no backup service: back the database container and the ferroma-data volume up
#     with the host's own tooling (docs/deployment.md §8)
#
# Before the first boot, read docs/deployment.md: DNS (MX/A/PTR/SPF/DKIM/DMARC)
# has to be in place or your mail will be rejected no matter how correct Ferroma is.
# =============================================================================

name: ferroma

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '10'

services:
  ferroma:
    # A released image, pulled — prod never builds. `FERROMA_REPO` and
    # `FERROMA_VERSION` are interpolated as two separate variables on purpose:
    # compose does not substitute a `${…}` nested inside another `${…:-…}`, so
    # `${FERROMA_IMAGE:-${FERROMA_REPO}:${FERROMA_VERSION}}` would silently
    # collapse to an empty tag. Override the repository for a mirror or a private
    # registry; the version stays required.
    image: ${FERROMA_REPO:-wesukilaye/ferroma}:${FERROMA_VERSION:?set FERROMA_VERSION to a released tag}
    container_name: ferroma
    restart: always
    # The host's own network, so the PostgreSQL already running here is
    # 127.0.0.1 from inside the container.
    network_mode: host
    # Values come from the `.env` `scripts/deploy.sh` writes — Compose reads that
    # file automatically. Anything stated here still beats a stored wizard answer,
    # so only answer what the deployment owns: the database address, the API bind,
    # the hostname/public URL, the JWT secret and the TLS material. The optional
    # wizard path is gone: the database connection has to be known before the
    # first boot, and this is how it gets there.
    env_file:
      - .env
    environment:
      FERROMA_DATA_DIR: ${FERROMA_DATA_DIR:-/var/lib/ferroma}
      FERROMA_LOG_LEVEL: ${FERROMA_LOG_LEVEL:-info}
      FERROMA_LOG_FORMAT: ${FERROMA_LOG_FORMAT:-json}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env (scripts/deploy.sh writes it)}
      FERROMA_API_HOST: ${FERROMA_API_HOST:-127.0.0.1}
      FERROMA_API_PORT: ${FERROMA_API_PORT:-18080}
      # The alias the server reads is FERROMA_API_PUBLIC_URL; the generic form
      # carries the deploy.sh-written FERROMA_PUBLIC_URL there (Compose cannot
      # nest one ${…} default inside another, so there is no `:-` fallback here
      # — FERROMA_PUBLIC_URL itself is ` …:?`-guarded two lines below).
      FERROMA__API__PUBLIC_URL: ${FERROMA_PUBLIC_URL}
      FERROMA_HOSTNAME: ${FERROMA_HOSTNAME:?set FERROMA_HOSTNAME in .env (scripts/deploy.sh writes it)}
      FERROMA_PUBLIC_URL: ${FERROMA_PUBLIC_URL:?set FERROMA_PUBLIC_URL in .env (scripts/deploy.sh writes it)}
      FERROMA_JWT_SECRET: ${FERROMA_JWT_SECRET:?set FERROMA_JWT_SECRET in .env (scripts/deploy.sh writes it)}
      # Terminate implicit TLS in Ferroma itself once deploy.sh has installed the
      # PEMs under ./tls. The ports exist only when these are set — alongside
      # FERROMA_TLS_ENABLED/CERT/KEY — which is why the demo stack and the
      # `.env.example` spell the same three settings.
      FERROMA_TLS_ENABLED: ${FERROMA_TLS_ENABLED:-false}
      FERROMA_TLS_CERT: ${FERROMA_TLS_CERT:-/etc/ferroma/tls/fullchain.pem}
      FERROMA_TLS_KEY: ${FERROMA_TLS_KEY:-/etc/ferroma/tls/privkey.pem}
      FERROMA__SMTP__SMTPS_PORT: ${FERROMA__SMTP__SMTPS_PORT:-0}
      FERROMA__IMAP__IMAPS_PORT: ${FERROMA__IMAP__IMAPS_PORT:-0}
      # Behind the reverse proxy, the proxy terminates HTTPS and its headers are
      # what must be believed. The API contract is unchanged: it still binds the
      # loopback address above so the proxy is the only client.
      FERROMA__API__TRUST_PROXY_HEADERS: ${FERROMA__API__TRUST_PROXY_HEADERS:-true}
      FERROMA__API__SECURE_COOKIES: ${FERROMA__API__SECURE_COOKIES:-true}
      # Plaintext SMTP/IMAP authentication is what a fresh deployment must not
      # allow on the unauthenticated MX and plaintext IMAP listeners; deploy.sh
      # writes both switches (false only with an explicit --no-tls run).
      FERROMA__SMTP__REQUIRE_TLS_FOR_AUTH: ${FERROMA__SMTP__REQUIRE_TLS_FOR_AUTH:-true}
      FERROMA__IMAP__REQUIRE_TLS_FOR_LOGIN: ${FERROMA__IMAP__REQUIRE_TLS_FOR_LOGIN:-true}
      FERROMA_DKIM_ENABLED: ${FERROMA_DKIM_ENABLED:-false}
      FERROMA_DKIM_SELECTOR: ${FERROMA_DKIM_SELECTOR:-default}
      FERROMA_DKIM_KEY: ${FERROMA_DKIM_KEY:-/var/lib/ferroma/dkim/default.private}
      # Informational bookkeeping from deploy.sh; the server ignores these names,
      # but keeping them here pins the .env contract the new check enforces.
      FERROMA_API_PUBLIC_URL: ${FERROMA_API_PUBLIC_URL:-}
      FERROMA_PUBLIC_PORT: ${FERROMA_PUBLIC_PORT:-443}
    # No `ports:` — host networking binds 25, 587, 465, 143, 993 and the API port
    # on the host directly. Docker cannot publish ports for a container in that mode.
    volumes:
      - ferroma-data:/var/lib/ferroma
      - ./tls:/etc/ferroma/tls:ro
      - ./dkim:/etc/ferroma/dkim:ro
    healthcheck:
      test: ['CMD-SHELL', 'ferroma healthcheck --url http://$${FERROMA_API_HOST:-127.0.0.1}:$${FERROMA_API_PORT:-18080}/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2g

  # No backup service ships here on purpose. Ferroma keeps no backup tooling in the
  # deployment: back up the database container and the ferroma-data volume with
  # whatever the host already uses (pg_dump + restic/borg/rsync, a hypervisor
  # snapshot, a storage-level snapshot). Both halves are needed together — a
  # database restored without its Maildir loses messages and vice versa.
  # docs/deployment.md §8 has the commands and what a backup must contain.

volumes:
  ferroma-data:
    name: ferroma-data
