# =============================================================================
# Ferroma — deployment onto a host that already runs PostgreSQL (and Docker)
# =============================================================================
#   scripts/deploy.sh                 # the supported entry point; do this first
#
# How this stack differs from docker-compose.prod.yml:
#
#   * **No PostgreSQL container.** Ferroma talks to the PostgreSQL that is
#     already running on this host, over 127.0.0.1. Nothing about that server's
#     configuration has to change: 127.0.0.1 is already in `listen_addresses`
#     and already in `pg_hba.conf` on every distribution.
#   * **Host networking.** The container binds 25/587/465/143/993 and the HTTP
#     API directly on the host, which is what makes the loopback database
#     reachable without a `host-gateway` route, and which keeps every mail
#     client's real source address (the login throttle and the logs depend on
#     it). Ports are therefore *not* published with `ports:` — see
#     `network_mode: host`.
#   * **HTTPS belongs to your reverse proxy.** Ferroma has no HTTPS listener;
#     nginx/Caddy/… proxies to the loopback API port. docs/deployment.md §5.3
#     has the nginx server block.
#   * **`.env` is the only configuration.** Every setting is an environment
#     variable, so there is no `ferroma.toml` to edit and no `-f` flags to
#     remember. See `.env.example` for the full list.
#
# Doing it by hand, without scripts/deploy.sh:
#
#   cp .env.example .env      # then edit it: DATABASE_URL, FERROMA_HOSTNAME, …
#   # Either pull the release — FERROMA_IMAGE in .env names it — or build here:
#   docker compose -f docker-compose.external-db.yml pull
#   # docker build -t ferroma:latest .   # then FERROMA_IMAGE=ferroma:latest
#   docker compose -f docker-compose.external-db.yml run --rm ferroma database init
#   docker compose -f docker-compose.external-db.yml up -d
# =============================================================================

name: ferroma

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '10'

services:
  ferroma:
    # Pulled from Docker Hub (`wesukilaye/ferroma:<tag>`) or built on this host —
    # either way the whole reference lives in `.env` as `FERROMA_IMAGE`, so an
    # upgrade is one line. `scripts/deploy.sh` also accepts `--image`.
    image: ${FERROMA_IMAGE:-wesukilaye/ferroma:latest}
    container_name: ferroma
    restart: always
    # Shares the host's network namespace: no NAT, no port mappings, and the
    # host's own PostgreSQL is simply 127.0.0.1 from inside the container.
    network_mode: host
    # Everything the platform reads comes from here.
    env_file:
      - .env
    environment:
      FERROMA_CONFIG: /etc/ferroma/ferroma.toml
      FERROMA_DATA_DIR: /var/lib/ferroma
      # `api.public_url` is deliberately *not* set here. It is the one value the first-run
      # wizard collects, it is stored in the database, and the server adopts it at startup
      # precisely because the configuration still holds the default — stating it here (or
      # in `.env`) would make the deployment win and the wizard's answer a no-op.
    volumes:
      # Maildir, attachments and DKIM keys. This is the volume to back up.
      - ferroma-data:/var/lib/ferroma
      # Certificates for SMTPS (465) and IMAPS (993). Read-only: Ferroma never
      # writes here. `deploy.sh` installs them with the ownership uid 10001
      # needs; docs/deployment.md §5.5 explains the manual path.
      - ./tls:/etc/ferroma/tls:ro
    healthcheck:
      # Follows the configured bind address and port: with the API on loopback the
      # probe is a loopback connection, and when it is bound to the Docker bridge
      # address (a containerised reverse proxy cannot reach loopback) the probe
      # follows it there too.
      test: ['CMD', 'ferroma', 'healthcheck', '--url', 'http://${FERROMA_API_HOST:-127.0.0.1}:${FERROMA_API_PORT:-18080}/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 60s
    ulimits:
      # One file descriptor per open IMAP/SMTP connection, plus the Maildir.
      nofile:
        soft: 65536
        hard: 65536
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2g

  # No backup or restore service ships here on purpose. Back up the host's
  # PostgreSQL and the ferroma-data volume with whatever the host already uses
  # (pg_dump + restic/borg/rsync, a volume-level snapshot). The two halves belong
  # together — a database restored without its Maildir loses messages and vice
  # versa. docs/deployment.md §8 has the commands and what a backup must contain.

volumes:
  ferroma-data:
    name: ferroma-data
