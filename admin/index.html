<!doctype html>
<html lang="en" data-theme="auto" data-app="admin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n>Ferroma Admin</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#view-root" data-i18n>Skip to content</a>

  <div id="offline-banner" class="banner banner-offline" role="status" hidden>
    <span class="banner-text" data-i18n>You are offline. The management API could not be reached; showing the last data it returned.</span>
    <button type="button" class="btn btn-small" id="offline-retry" data-i18n>Retry</button>
  </div>

  <!-- Sign-in, shown when the admin console has no usable session -->
  <div id="login-view" class="login-view" hidden>
    <form class="login-card" id="login-form" novalidate>
      <h1 class="login-title" data-i18n>Ferroma Admin</h1>
      <p class="login-subtitle" data-i18n>Operator console — sign in with an administrator account</p>

      <label class="field">
        <span class="field-label" data-i18n>Email address</span>
        <input class="input" id="login-email" name="email" type="email" autocomplete="username" spellcheck="false" required>
      </label>
      <p class="field-error" id="login-email-error" hidden></p>

      <label class="field">
        <span class="field-label" data-i18n>Password</span>
        <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="field-error" id="login-password-error" hidden></p>

      <p class="field-error" id="login-error" role="alert" hidden></p>

      <button class="btn btn-primary btn-block" id="login-submit" type="submit" data-i18n>Sign in</button>
      <p class="login-hint" data-i18n>The Webmail sign-in lives at the site root.</p>
    </form>
  </div>

  <div class="app" id="app-view" hidden>
    <header class="topbar">
      <button type="button" class="btn btn-icon nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="sidebar"
              data-i18n-aria-label aria-label="Show navigation" data-i18n-title title="Show navigation">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
      </button>
      <span class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M12 3 4 6v6c0 4.2 3.4 7.6 8 9 4.6-1.4 8-4.8 8-9V6l-8-3Z" fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linejoin="round"></path>
            <path d="M9 12h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          </svg>
        </span>
        <span class="brand-text">Ferroma <span class="brand-sub" data-i18n>Admin</span></span>
      </span>
      <span class="topbar-status" id="topbar-status" role="status"></span>
      <button type="button" class="btn btn-icon theme-toggle" id="theme-toggle" aria-pressed="false"
              data-i18n-aria-label aria-label="Switch theme" data-i18n-title title="Switch light / dark">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"
                fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linejoin="round"></path>
        </svg>
      </button>
      <button type="button" class="btn btn-icon" id="account-button" data-i18n-aria-label aria-label="Account menu"
              aria-haspopup="true" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle>
          <path d="M4 21c0-4 3.6-6 8-6s8 2 8 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
      </button>
      <div class="menu" id="account-menu" role="menu" hidden>
        <p class="menu-heading" id="account-menu-name" data-i18n>Signed in</p>
        <p class="menu-sub" id="account-menu-email"></p>
        <a class="menu-item" role="menuitem" href="../" data-i18n>Open Webmail</a>
        <button type="button" class="menu-item" role="menuitem" id="account-logout" data-i18n>Sign out</button>
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar" id="sidebar" data-i18n-aria-label aria-label="Console sections">
        <ul class="nav-list" id="nav-list"></ul>
        <div class="sidebar-foot">
          <p class="sidebar-meta" id="sidebar-version"></p>
        </div>
      </nav>

      <main class="content" id="view-root" tabindex="-1">
        <div class="loading-state" id="boot-loading">
          <p class="loading-text" data-i18n>Loading the console…</p>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-host" id="modal-host"></div>
  <div class="modal-host" id="dialog-host"></div>

  <div class="toasts" id="toast-region" role="status" aria-live="polite" aria-atomic="false"></div>
  <div class="toasts toasts-alert" id="alert-region" role="alert" aria-live="assertive" aria-atomic="false"></div>

  <!-- Loaded first and with no imports, so it survives the failure it reports: an entry
       module that never loads would otherwise leave the page blank. -->
  <script type="module" src="../shared/diag.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
